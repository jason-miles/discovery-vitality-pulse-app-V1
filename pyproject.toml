[project]
name = "vitality-pulse"
version = "1.0.0"
description = "Vitality Pulse — Shared-Value Analytics Portal (Databricks App)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    # databricks-sdk is pre-installed in the Databricks Apps runtime, so it is
    # intentionally NOT declared here — this trims ~8 transitive wheels the
    # build proxy would otherwise have to fetch. It is still imported at runtime.
]

[tool.uv]
package = false
